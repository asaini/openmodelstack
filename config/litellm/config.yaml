model_list:
  - model_name: nemotron
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b
      custom_llm_provider: fireworks_ai
      api_key: os.environ/FIREWORKS_API_KEY
      drop_params: true
      additional_drop_params:
        - reasoning_effort
        - reasoning_summary
        - client_metadata

  - model_name: glm-5p2
